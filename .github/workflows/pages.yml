# 푸시할 때마다 GitHub Pages에 자동 배포
# 주소: https://pnoni2080.github.io/Foley-artist/
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/adoring-shannon-migwxk
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
